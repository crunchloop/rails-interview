version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/rails-interview
    command: sleep infinity
    ports:
      - "3000:3000"
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"